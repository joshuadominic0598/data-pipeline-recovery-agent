bundle:
  name: vitalroute-recovery

variables:
  cluster_id:
    description: Existing Databricks cluster with Python 3.11+ and Spark 4 compatibility
  data_root:
    description: Writable Unity Catalog volume path, e.g. /Volumes/catalog/schema/vitalroute
  notification_email:
    default: joshuadominic747@gmail.com

sync:
  paths:
    - ../../src
    - ./notebooks
  exclude:
    - ../../src/**/__pycache__/**

resources:
  jobs:
    cold_chain:
      name: vitalroute-cold-chain-${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - name: partition_date
          default: "{{job.start_time.iso_date}}"
        - name: scenario
          default: healthy
      email_notifications:
        on_failure: ["${var.notification_email}"]
      tasks:
        - task_key: ingestion
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/stage.py
            base_parameters:
              stage: ingestion
              source_root: "${var.data_root}/{{job.run_id}}"
              partition_date: "{{job.parameters.partition_date}}"
              scenario: "{{job.parameters.scenario}}"
        - task_key: cleaning
          depends_on: [{task_key: ingestion}]
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/stage.py
            base_parameters:
              stage: cleaning
              source_root: "${var.data_root}/{{job.run_id}}"
        - task_key: preprocessing
          depends_on: [{task_key: cleaning}]
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/stage.py
            base_parameters:
              stage: preprocessing
              source_root: "${var.data_root}/{{job.run_id}}"
        - task_key: business_rules
          depends_on: [{task_key: preprocessing}]
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/stage.py
            base_parameters:
              stage: business_rules
              source_root: "${var.data_root}/{{job.run_id}}"
        - task_key: consumption
          depends_on: [{task_key: business_rules}]
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/stage.py
            base_parameters:
              stage: consumption
              source_root: "${var.data_root}/{{job.run_id}}"
        - task_key: recovery_agent
          depends_on: [{task_key: ingestion}, {task_key: cleaning}, {task_key: preprocessing}, {task_key: business_rules}, {task_key: consumption}]
          run_if: AT_LEAST_ONE_FAILED
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/recovery_agent.py
            base_parameters:
              source_root: "${var.data_root}/{{job.run_id}}"
              job_run_id: "{{job.run_id}}"

targets:
  dev:
    mode: development
    default: true
    presets:
      trigger_pause_status: PAUSED
